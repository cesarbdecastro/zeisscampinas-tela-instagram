<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; padding:0; background:#000; overflow:hidden; }
  .container { display:flex; width:100vw; height:100vh; }
  .left { width:50%; height:100%; display:flex; align-items:center; justify-content:center; background:#000; }
  .right { width:50%; height:100%; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; padding:40px; box-sizing:border-box; }
  .right p { font-size:1.6vw; font-family:Arial, sans-serif; line-height:1.4; }
  video { width:100%; height:100%; object-fit:cover; }
  img { width:100%; height:100%; object-fit:contain; }
</style>
</head>
<body>
  <div class="container">
    <div class="left">
      <video id="video" autoplay muted loop playsinline style="display:none">
        <source id="videoSource" src="" type="video/mp4">
      </video>
      <img id="image" style="display:none">
    </div>
    <div class="right">
      <p id="caption">Carregando...</p>
    </div>
  </div>

  <script>
    async function loadContent() {
      try {
        const response = await fetch('data.json?t=' + Date.now());
        const data = await response.json();

        const videoEl = document.getElementById('video');
        const imageEl = document.getElementById('image');
        const url = data.video || '';
        const isVideo = (data.type === 'VIDEO');

        if (isVideo) {
          document.getElementById('videoSource').src = url;
          videoEl.load();
          videoEl.style.display = 'block';
          imageEl.style.display = 'none';
        } else {
          imageEl.src = url;
          imageEl.style.display = 'block';
          videoEl.style.display = 'none';
          videoEl.pause();
        }

        document.getElementById('caption').innerText = data.caption;
      } catch (e) {
        console.error('Erro ao carregar data.json', e);
      }
    }
    loadContent();
    setInterval(loadContent, 30000);
  </script>
</body>
</html>
